      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
    <linearGradient id="trefoilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
